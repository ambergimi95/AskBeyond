 {id:'c1',page:'64',sec:'2-4 乳癌的病理分期與預後因子',title:'分期的重要性與七個預後因子',fig:true,kw:'預後因子 七個因子',
  text:'目前，由美國癌症聯合委員會與全世界的抗癌聯盟有整合的共識，決定全世界要有一致的癌症分期。對臨床醫師而言，正確的診斷和癌症的分類與分期，是作為選擇最適切的治療及預測病人存活最重要的依據。根據各種大型研究報告，對早期乳癌確認了七個可以影響預後的重要因子（預後因子）：淋巴結是否轉移、原發腫瘤大小、核仁分化級數、荷爾蒙接受體有無、腫瘤組織類別、細胞增生速率、HER2 是否過度表現。\n據此臨床醫師能對大部分乳癌患者的選擇輔助治療有良好的判定依據，其中又以淋巴結轉移狀態最為重要；針對淋巴結轉移的陽性患者，術後需給予化學治療或荷爾蒙治療（荷爾蒙受體陽性）或放射線治療，已是各國專家皆有的共識。'},
 {id:'c2',page:'64',sec:'2-4 乳癌的病理分期與預後因子',title:'分期的臨床實用價值',

  text:'對於乳癌之放射治療、化學治療、手術治療、重建、荷爾蒙治療、標靶治療及免疫治療等均會在本章節中做基本之介紹，得以讓讀者了解乳癌治療的多樣化及現今之發展，而各種用藥也以圖說方式讓讀者更能了解用藥細節與可能之副作用，以做參考。'},
 {id:'c6',page:'72',sec:'3-1 乳癌的個人化治療',title:'乳癌的發生率與死亡率',
  text:'根據研究資料顯示，民國 88 年國內女性乳癌每年新增病例約 2000 例，民國 106 年新增乳癌人數高達 13965 人，增加的速度驚人。自 98 年起發生率已躍居女性癌症第一名，直至現在依然首居排行榜第一位。而死亡率在 108 年為第三名，死亡率之排名較發生率低，其中原因在於乳癌近年的治療方法多元化，可以因腫瘤之期別、特性，因而制定較完整、較周全的治療計畫，及乳癌篩檢可以偵測到手觸摸不到的早期乳癌。'},
 {id:'c7',page:'72',sec:'3-1 乳癌的個人化治療',title:'乳癌的分子生物學分類',
  text:'這是目前乳癌可以從傳統的 TNM 之分期再進步到精準醫療境界最重要的環節之一，使用分子亞型分類法在不同的 TNM 分期下，也會有許多不同的治療方式。這種分類初期是用 cDNA 微陣列分析基因表現檢測病人之樣本加以分析後，區分成五類。這五類和生物標記組合得到之結果相符程度很高，因此臨床上能用此分類來做為治療之依據，而不是完全依賴傳統之 TNM 系統。'},

const CRISIS_RE=/放棄治療|不想(再)?治療|不要治療|不治療了|不想活|想死|自殺|輕生|結束(自己的)?生命|活不下去|撐不下去/;
const ADVICE_RE=/(自己|擅自|私自).{0,4}(停|減|換|加|吃|打)|停藥|停掉|不吃藥|不要吃藥|劑量|吃幾顆|吃多少|這個藥我|該吃什麼藥|要不要.{0,4}(化療|化學治療|開刀|手術|放療|放射|荷爾蒙|標靶|切除)|該不該|我.{0,4}(是|算|屬於).{0,2}第.期|我的.{0,6}(診斷|分期|報告|復發)/;

function normQuery(q){
  const map={'0':'零','零':'零','1':'一','一':'一','I':'一','2':'二','二':'二','II':'二','3':'三','三':'三','III':'三','4':'四','四':'四','IV':'四'};
  return q.replace(/第?\s*(IV|III|II|I|0|零|1|2|3|4|一|二|三|四)\s*期/gi,function(m,n){
    const k=map[n.toUpperCase()]||map[n];
    return k==='零'?'零期':'第'+k+'期';
  });
}
function retrieve(q){
  const nq=normQuery(q).toUpperCase();
  const score=new Map(KB.map(c=>[c.id,0]));
  for(const c of KB){
    let s=0;
    for(const t of LEX){ if(nq.includes(t)&&c.hay.includes(t)) s+=t.length; }
    score.set(c.id,s);
  }
  for(const b of BOOST){ if(b.re.test(q)) b.ids.forEach(id=>score.set(id,score.get(id)+b.w)); }
  const ranked=KB.map(c=>({c,s:score.get(c.id)})).filter(x=>x.s>=2).sort((a,b)=>b.s-a.s);
  if(!ranked.length) return [];
  const top=ranked[0].s;
  return ranked.filter(x=>x.s>=top*0.4).slice(0,3).map(x=>x.c);
}
function decide(q){
  if(CRISIS_RE.test(q)) return {kind:'crisis'};
  if(ADVICE_RE.test(q)) return {kind:'advice'};
  const hits=retrieve(q);
  return hits.length?{kind:'rag',hits}:{kind:'oos'};
}

const TAG={
 rag:{label:'依書中內容回答',cls:'t-live'},
 canned:{label:'預錄示範答案',cls:'t-pre'},
 advice:{label:'不提供個人用藥建議',cls:'t-guard'},
 oos:{label:'書中查無資料，不作答',cls:'t-warn'},
 crisis:{label:'關懷與求助指引',cls:'t-guard'},
 error:{label:'無法回答',cls:'t-warn'}
};
const BUBBLE={advice:'guard',crisis:'guard',oos:'warn',error:'warn'};

const $=s=>document.querySelector(s);
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function h(tag,props,...kids){
  const el=document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(k==='class') el.className=v;
    else if(k==='text') el.textContent=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v);
  }
  for(const kid of kids.flat()){ if(kid==null) continue; el.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return el;
}
function avatar(){
  const d=h('div',{class:'av'});
  d.innerHTML='<svg aria-hidden="true"><use href="#doc"/></svg>';
  return d;
}

let busy=false, sampleFn;
const samplePromise=(async()=>{
  try{ if(!window.claude||!window.claude.use) return null; return await window.claude.use('sample'); }
  catch(e){ return null; }
})().then(s=>{ sampleFn=s; return s; });

function citedSet(text,srcs){
  const s=new Set(); const re=/\[S(\d+)\]/g; let m;
  while((m=re.exec(text))){ const i=+m[1]-1; if(srcs[i]) s.add(i); }
  return s;
}
function renderRich(node,text,ex){
  node.textContent='';
  for(const p of text.split(/(\[S\d+\])/g)){
    const m=/^\[S(\d+)\]$/.exec(p);
    if(m){
      const i=+m[1]-1, c=ex.srcs[i];
      if(c) node.append(h('button',{class:'cite',type:'button','aria-label':'書中出處 第'+c.page+'頁',onclick:()=>openSrc(ex,i)},'第'+c.page+'頁'));
    } else if(p) node.append(document.createTextNode(p));
  }
}
function openSrc(ex,i){
  if(!ex.srcBox) return;
  ex.srcBox.open=true;
  const el=ex.srcBox.querySelector('[data-i="'+i+'"]'); if(!el) return;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  el.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
}
function buildSources(ex,list){
  if(!list.length) return null;
  const box=h('details',{class:'srcs'},h('summary',null,'書中出處（'+list.length+' 段）'));
  list.forEach(function(c){
    const i=ex.srcs.indexOf(c);
    box.append(h('div',{class:'src','data-i':String(i)},
      h('div',{class:'srcmeta'},h('b',null,'第 '+c.page+' 頁'),h('span',null,c.sec+' · '+c.title)),
      h('p',{class:'stext'},c.text),
      c.fig?h('p',{class:'figtag'},'圖表內容，已人工改寫為文字'):null));
  });
  return box;
}

function newExchange(q){
  const ex={srcs:[],srcBox:null};
  ex.me=h('div',{class:'me',text:q});
  ex.tag=h('span',{class:'tagline t-pre'},'檢索書中段落…');
  ex.body=h('div',{class:'abody'});
  ex.bubble=h('div',{class:'bubble'},ex.tag,ex.body);
  const row=h('div',{class:'bot'},avatar(),ex.bubble);
  $('#log').append(ex.me,row);
  return ex;
}
function finish(ex,o){
  ex.srcs=o.srcs||[];
  const cited=citedSet(o.text,ex.srcs);
  const T=TAG[o.kind];
  ex.tag.className='tagline '+T.cls; ex.tag.textContent=T.label;
  if(BUBBLE[o.kind]) ex.bubble.classList.add(BUBBLE[o.kind]);
  renderRich(ex.body,o.text,ex);
  if(o.kind==='rag'&&cited.size===0) ex.bubble.append(h('p',{class:'warnline'},'這個回答沒有標出書中出處，需要人工檢視。'));
  const showList=(o.kind==='rag'||o.kind==='error')?ex.srcs:ex.srcs.filter((c,i)=>cited.has(i));
  if(ex.srcBox) ex.srcBox.remove();
  ex.srcBox=buildSources(ex,o.kind==='rag'?ex.srcs:showList);
  if(ex.srcBox) ex.bubble.append(ex.srcBox);
}

function buildPrompt(q,hits){
  const ctx=hits.map((c,i)=>'[S'+(i+1)+']（第'+c.page+'頁，'+c.sec+'）\n'+c.text).join('\n\n');
  return '你是《超越乳癌》這本書的衛教問答助理（原型展示版），對象是乳癌病友與家屬。\n'
   +'請嚴格遵守：\n'
   +'1. 只能根據下方「書中段落」回答，不可使用段落以外的醫學知識。段落沒有提到的內容，直接說「書中這幾頁沒有提到」。\n'
   +'2. 每個重點句後面標註出處，格式為 [S1]、[S2]，編號對應書中段落。\n'
   +'3. 不做個人診斷，不建議用藥、劑量，也不建議是否接受某項治療；涉及治療選擇時，提醒與主治醫師討論。\n'
   +'4. 你是 AI 助理，不要假裝是任何真實醫師或作者本人，不使用「我是某某醫師」的說法。\n'
   +'5. 語氣溫和、白話，使用台灣繁體中文；必要時簡短解釋專有名詞。\n'
   +'6. 控制在 220 字內，可用「・」或數字條列，不要使用 markdown 標題或粗體符號。\n'
   +'7. 若問題涉及統計數字，說明這是書中記載的資料，最新數字請以官方資料為準。\n\n'
   +'【書中段落】\n'+ctx+'\n\n【問題】\n'+q;
}

function fallback(ex,q,hits,reason){
  const chip=CHIPS.find(c=>c.q===q&&c.canned);
  if(chip) finish(ex,{kind:'canned',text:chip.canned.text,srcs:chip.canned.ids.map(id=>byId[id])});
  else finish(ex,{kind:'error',text:reason,srcs:hits});
}
async function live(ex,q,hits){
  ex.srcs=hits;
  const sample=sampleFn===undefined?await samplePromise:sampleFn;
  if(!sample){ fallback(ex,q,hits,MSG.offline); return; }
  ex.tag.className='tagline t-live'; ex.tag.textContent='整理回答中…';
  try{
    const res=await sample(buildPrompt(q,hits),{cache:false,modelTier:'default',onText:function(t){ renderRich(ex.body,t.text,ex); }});
    finish(ex,{kind:'rag',text:res.text,srcs:hits});
  }catch(err){
    const code=err&&err.code;
    fallback(ex,q,hits,code==='not_granted'?MSG.denied:code==='rate_limited'?MSG.rate:MSG.fail);
  }
}

function setBusy(b){
  busy=b;
  document.querySelectorAll('.chip,#send,#newchat').forEach(el=>{ el.disabled=b; });
  $('#mascot').classList.toggle('talk',b);
}
async function ask(raw){
  const q=raw.trim();
  if(!q||busy) return;
  setBusy(true);
  $('#app').classList.add('chatting');
  const ex=newExchange(q);
  ex.me.scrollIntoView({block:'start',behavior:reduce?'auto':'smooth'});
  await sleep(350);
  try{
    const r=decide(q);
    if(r.kind==='crisis') finish(ex,{kind:'crisis',text:MSG.crisis,srcs:[]});
    else if(r.kind==='advice') finish(ex,{kind:'advice',text:MSG.advice,srcs:[byId.c9]});
    else if(r.kind==='oos') finish(ex,{kind:'oos',text:MSG.oos,srcs:[]});
    else await live(ex,q,r.hits);
  }catch(e){
    finish(ex,{kind:'error',text:MSG.fail,srcs:[]});
  }finally{
    setBusy(false);
    ex.bubble.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
  }
}

CHIPS.forEach(c=>{
  $('#chips').append(h('button',{class:'chip',type:'button',onclick:()=>ask(c.q)},c.label));
});
$('#newchat').addEventListener('click',function(){
  if(busy) return;
  $('#log').textContent='';
  $('#app').classList.remove('chatting');
  window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
  $('#qin').focus();
});
const qin=$('#qin');
$('#ask').addEventListener('submit',e=>{
  e.preventDefault();
  const v=qin.value;
  if(!v.trim()) return;
  qin.value='';
  ask(v);
});
qin.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); $('#ask').requestSubmit(); }
});
})();
